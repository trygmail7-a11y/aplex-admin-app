name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install sharp for image conversion
        run: npm install sharp

      - name: Copy web files
        run: |
          mkdir -p www
          cp admin.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force replace all launcher icons with logo.png
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const base = 'android/app/src/main/res/';
          const configs = [
            { size: 48,  folder: 'mipmap-mdpi' },
            { size: 72,  folder: 'mipmap-hdpi' },
            { size: 96,  folder: 'mipmap-xhdpi' },
            { size: 144, folder: 'mipmap-xxhdpi' },
            { size: 192, folder: 'mipmap-xxxhdpi' }
          ];
          async function generate() {
            for (const {size, folder} of configs) {
              const dir = path.join(base, folder);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
              const files = ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'];
              for (const file of files) {
                await sharp('logo.png')
                  .resize(size, size, { fit: 'contain', background: { r:0,g:0,b:0,alpha:0 } })
                  .png()
                  .toFile(path.join(dir, file));
                console.log('Written: ' + folder + '/' + file);
              }
            }
            console.log('All icons replaced!');
          }
          generate().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplex-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
